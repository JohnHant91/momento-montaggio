name = "momento-reel"
main = "src/index.js"
compatibility_date = "2025-10-01"
account_id = "608de24cab8194f995e09e76369e5b65"
workers_dev = true
keep_vars = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "momento-reel"
database_id = "bba77d37-c34e-4dd1-9514-5463ca1d9fec"

[[kv_namespaces]]
binding = "VIDEO"
id = "a0a0abcdb7ab4d4c89929628dee137b1"

# archivio interno dell'agenzia (cartelle clienti, clip, musica, grafiche): serve R2 attivo sull'account
[[r2_buckets]]
binding = "ARCHIVIO"
bucket_name = "momento-archivio"
