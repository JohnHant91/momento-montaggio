# Pubblica la regia (Worker momento-reel) su Cloudflare a ogni modifica di worker/.
# Serve il segreto CLOUDFLARE_API_TOKEN nel repository (Settings → Secrets and variables → Actions).
# I segreti del Worker (chiavi Claude, Apify) restano su Cloudflare: la pubblicazione non li tocca.
name: pubblica

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/pubblica.yml"]
  workflow_dispatch: {}

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Controllo token
        id: token
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::notice::Nessun CLOUDFLARE_API_TOKEN: la regia si pubblica dal connettore Cloudflare in chat"; echo "ok=no" >> "$GITHUB_OUTPUT"; else echo "ok=si" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'si'
        with:
          node-version: "22"

      - name: Pubblica il Worker
        if: steps.token.outputs.ok == 'si'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy

      - name: Prova
        if: steps.token.outputs.ok == 'si'
        run: curl -fsS https://momento-reel.gestionalelcl.workers.dev/api/stato && echo
