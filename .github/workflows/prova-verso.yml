# Prova del verso delle clip di una cartella dell'Archivio: nessun montaggio, solo il controllo (circa 1 centesimo).
# Le tavole di controllo escono cifrate con la chiave dello studio; nel log solo numeri.
name: prova-verso

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  REGIA: https://momento-reel.gestionalelcl.workers.dev

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; fi
          pip install -q pillow
      - name: Controllo del verso
        run: python3 motore/prova_verso.py
      - name: Tavole (cifrate)
        if: always()
        run: |
          ls /tmp/tavole/*.jpg >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/out && cd /tmp/tavole && tar czf /tmp/t.tgz *.jpg
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t.tgz -out /tmp/out/tavole.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/motore/chiave_studio.pem" -in /tmp/k.bin -out /tmp/out/k.enc
          cd /tmp/out && git init -q && git checkout -q -b tavole-verso && git add . \
          && git -c user.name=motore -c user.email=motore@momento commit -qm "tavole verso" \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tavole-verso
