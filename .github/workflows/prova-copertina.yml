# Prova della copertina moderna su una foto di pubblico dominio (solo per verificare installazione e resa)
name: prova-copertina
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy opencv-python-headless "rembg[cpu]"
      - name: Copertina di prova
        run: |
          curl -fsSL -o persona.jpg "https://raw.githubusercontent.com/danielgatis/rembg/main/examples/girl-1.jpg"
          file persona.jpg
          cd motore && time python3 -c "
          import copertina as C
          C.copertina_moderna('../persona.jpg', 0, 'Il segreto della VERA colazione', '../cop_persona.jpg', immagine=True, evidenzia='vera')
          C.copertina_moderna('../persona.jpg', 0, '3 errori col caffè', '../cop_rossa.jpg', immagine=True, evidenzia='errori', accento='#FF4D4D')
          print('scontorno:', C._scontorna.__name__, getattr(C._scontorna, 'sessione', None) is not None)
          "
      - name: Risultato sul ramo prove-copertina
        run: |
          mkdir /tmp/out && cp cop_*.jpg /tmp/out/ && cd /tmp/out && git init -q && git checkout -q -b prove-copertina
          git config user.email bot@momento && git config user.name motore && git add . && git commit -qm prova
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prove-copertina
