# Studio: fotogrammi originali di una clip dell'Archivio, cifrati con la chiave dello studio.
name: guarda-clip
on:
  workflow_dispatch:
    inputs:
      clip: { description: "nome del file", required: true }
      da: { description: "secondo di partenza", required: false, default: "0" }
      dur: { description: "durata", required: false, default: "1.5" }
permissions:
  id-token: write
  contents: write
env:
  REGIA: https://momento-reel.gestionalelcl.workers.dev
jobs:
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Estrai
        env: { CLIP: "${{ github.event.inputs.clip }}", DA: "${{ github.event.inputs.da }}", DUR: "${{ github.event.inputs.dur }}" }
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null)
          python3 motore/guarda_clip.py
      - name: Cifra
        run: |
          mkdir -p /tmp/out && cd /tmp/tavole && tar czf /tmp/t.tgz *
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t.tgz -out /tmp/out/t.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/motore/chiave_studio.pem" -in /tmp/k.bin -out /tmp/out/k.enc
          cd /tmp/out && git init -q && git checkout -q -b guarda-clip && git add . \
          && git -c user.name=motore -c user.email=motore@momento commit -qm "clip" \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" guarda-clip
