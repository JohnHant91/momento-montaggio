# Motore "occhi" di Momento Reel
# Ogni 5 minuti (GitHub in pratica lo lancia circa ogni ora) chiede alla regia se ci sono video da guardare.
# Scarica e misura i video (ffmpeg, Whisper) e manda misure + fotogrammi alla regia, che li fa guardare a Claude.
# Si presenta con l'identità firmata da GitHub (OIDC): nessuna chiave salvata qui.
name: occhi

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["motore/**", ".github/workflows/analizza.yml"]

permissions:
  id-token: write
  contents: write
  actions: write

concurrency:
  group: motore-occhi
  cancel-in-progress: false

env:
  REGIA: https://momento-reel.gestionalelcl.workers.dev

jobs:
  occhi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: C'è lavoro?
        id: coda
        run: |
          r=$(curl -fsS "$REGIA/api/motore/coda" || echo '{}')
          echo "$r"
          echo "lavoro=$(echo "$r" | grep -q '"lavoro":true' && echo si || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.coda.outputs.lavoro == 'si'

      - uses: actions/setup-python@v5
        if: steps.coda.outputs.lavoro == 'si'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motore/requirements.txt

      - name: Modello Whisper (in cache)
        if: steps.coda.outputs.lavoro == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Cache LUT
        uses: actions/cache@v4
        with:
          path: ~/.cache/momento-lut
          key: lut-gmic-v1-${{ hashFiles('motore/lut_catalogo.json') }}
          restore-keys: lut-gmic-v1-

      - uses: actions/setup-node@v4
        if: steps.coda.outputs.lavoro == 'si'
        with:
          node-version: "22"

      - name: Motore grafico (in cache)
        if: steps.coda.outputs.lavoro == 'si'
        uses: actions/cache@v4
        with:
          path: |
            grafiche/node_modules
            ~/.cache/remotion
          key: remotion-${{ hashFiles('grafiche/package.json') }}

      - name: Strumenti
        if: steps.coda.outputs.lavoro == 'si'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r motore/requirements.txt
          ffmpeg -version | head -1

      - name: Guarda i video e monta i reel
        if: steps.coda.outputs.lavoro == 'si'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python motore/analizza.py

      - name: Tavole di controllo (cifrate)
        if: always() && steps.coda.outputs.lavoro == 'si'
        run: |
          ls /tmp/tavole/*.jpg >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/out && cd /tmp/tavole && tar czf /tmp/t.tgz *.jpg
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t.tgz -out /tmp/out/tavole.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/motore/chiave_studio.pem" -in /tmp/k.bin -out /tmp/out/k.enc
          cd /tmp/out && git init -q && git checkout -q -b tavole && git add . \
          && git -c user.name=motore -c user.email=motore@momento commit -qm "tavole" \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tavole
