# Motore "occhi" di Momento Reel
# Ogni 5 minuti (GitHub in pratica lo lancia circa ogni ora) chiede alla regia se ci sono video da guardare.
# Scarica e misura i video (ffmpeg, Whisper) e manda misure + fotogrammi alla regia, che li fa guardare a Claude.
# Si presenta con l'identità firmata da GitHub (OIDC): nessuna chiave salvata qui.
name: occhi

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["motore/**", ".github/workflows/analizza.yml"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: motore-occhi
  cancel-in-progress: false

env:
  REGIA: https://momento-reel.gestionalelcl.workers.dev

jobs:
  occhi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: C'è lavoro?
        id: coda
        run: |
          r=$(curl -fsS "$REGIA/api/motore/coda" || echo '{}')
          echo "$r"
          echo "lavoro=$(echo "$r" | grep -q '"lavoro":true' && echo si || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.coda.outputs.lavoro == 'si'

      - uses: actions/setup-python@v5
        if: steps.coda.outputs.lavoro == 'si'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motore/requirements.txt

      - name: Modello Whisper (in cache)
        if: steps.coda.outputs.lavoro == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Strumenti
        if: steps.coda.outputs.lavoro == 'si'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r motore/requirements.txt
          ffmpeg -version | head -1

      - name: Guarda i video e monta i reel
        if: steps.coda.outputs.lavoro == 'si'
        run: python motore/analizza.py
