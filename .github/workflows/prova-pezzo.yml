name: prova-pezzo
on: { workflow_dispatch: {} }
permissions: { id-token: write, contents: write }
env: { REGIA: "https://momento-reel.gestionalelcl.workers.dev" }
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null)
          pip install -q -r motore/requirements.txt
      - name: Pezzo
        env: { CLIP: "C0050.MP4", DA: "3", DUR: "3" }
        run: python3 motore/guarda_clip.py && python3 motore/prova_pezzo.py
      - name: Cifra
        run: |
          mkdir -p /tmp/out && cd /tmp/studio && tar czf /tmp/t.tgz *.mp4
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t.tgz -out /tmp/out/t.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/motore/chiave_studio.pem" -in /tmp/k.bin -out /tmp/out/k.enc
          cd /tmp/out && git init -q && git checkout -q -b prova-pezzo && git add . \
          && git -c user.name=motore -c user.email=motore@momento commit -qm "pezzo" \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prova-pezzo
