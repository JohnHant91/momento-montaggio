name: temi
on:
  workflow_dispatch:
jobs:
  temi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anteprime dei temi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          cd worker && node prove/temi.mjs /tmp/temi && cd /tmp/temi
          ls *.html | xargs -P 6 -I{} sh -c 'google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1080,1350 --virtual-time-budget=9000 --screenshot=$(basename {} .html).png file:///tmp/temi/{} >/dev/null 2>&1'
          mkdir out
          for t in $(ls *-1.png | sed 's/-1.png//'); do ffmpeg -v error -pattern_type glob -i "$t-*.png" -vf "scale=432:540,tile=7x1" -frames:v 1 -q:v 3 out/$t.jpg; done
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: temi
          path: /tmp/temi/out
          retention-days: 2
