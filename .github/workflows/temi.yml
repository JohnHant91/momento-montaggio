name: temi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  temi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anteprime dei temi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          cd worker && node prove/temi.mjs /tmp/temi && cd /tmp/temi
          ls *.html | xargs -P 6 -I{} sh -c 'google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1080,1350 --virtual-time-budget=9000 --screenshot=$(basename {} .html).png file:///tmp/temi/{} >/dev/null 2>&1'
          mkdir out
          for t in $(ls *-1.png | sed 's/-1.png//'); do ffmpeg -v error -pattern_type glob -i "$t-*.png" -vf "scale=432:540,tile=7x1" -frames:v 1 -q:v 3 out/$t.jpg; done
          ls out | wc -l
      - name: Pubblica sul ramo temi (solo slide di prova, nessun dato dei clienti)
        run: |
          cd /tmp/temi/out && git init -q && git checkout -q -b temi && git add -A
          git -c user.name=motore -c user.email=motore@users.noreply.github.com commit -qm temi
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} temi
