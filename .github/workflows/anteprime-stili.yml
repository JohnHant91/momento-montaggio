# Anteprime dell'archivio Stili: renderizza ogni stile di sottotitoli e pubblica una tavola sul ramo anteprime-stili.
name: anteprime-stili
on:
  workflow_dispatch:
    inputs:
      sezioni: { required: false, default: 'sottotitoli font transizioni animazioni elementi dietro' }
permissions:
  contents: write
jobs:
  anteprime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Installa
        working-directory: grafiche
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Sottotitoli
        if: contains(github.event.inputs.sezioni, 'sottotitoli')
        working-directory: grafiche
        run: |
          mkdir -p out
          for s in karaoke box pop grassetto minimal neon chiave contorno macchina mano; do
            echo "{\"stile\":\"$s\",\"accento\":\"#FFD60A\",\"font\":\"Arial Black, Arial, sans-serif\",\"parole\":[{\"t\":\"Questo\",\"da\":0.1,\"a\":0.4},{\"t\":\"panettone\",\"da\":0.4,\"a\":0.9,\"k\":true},{\"t\":\"cambia\",\"da\":0.9,\"a\":1.3},{\"t\":\"tutto\",\"da\":1.3,\"a\":1.8}]}" > p.json
            npx remotion still src/index.ts ProvaSottotitoli out/$s.png --props=p.json --frame=20 --log=error
          done
          for fnt in Anton Oswald "Permanent Marker" "DM Serif Display" Caveat "Archivo Black"; do
            n=$(echo "$fnt" | tr -d ' ')
            echo "{\"stile\":\"chiave\",\"accento\":\"#FF5E1A\",\"font\":\"$fnt\",\"parole\":[{\"t\":\"Font\",\"da\":0.1,\"a\":0.4},{\"t\":\"$fnt\",\"da\":0.4,\"a\":0.9,\"k\":true}]}" > p.json
            npx remotion still src/index.ts ProvaSottotitoli out/font_$n.png --props=p.json --frame=20 --log=error || echo "ERRORE font $fnt"
          done
          ls out
      - name: Transizioni
        if: contains(github.event.inputs.sezioni, 'transizioni')
        working-directory: grafiche
        run: |
          mkdir -p out/tr
          for t in dissolvenza zoom_blur whip_sx whip_dx whip_su glitch rgb_split flash_bianco light_leak scorri_su zoom_in spin iris sfocatura flash_nero tendina_sx tendina_dx tendina_su tendina_giu spingi_sx spingi_dx spingi_giu copri_sx copri_dx copri_su copri_giu cerchio_chiudi rombo rettangolo apri_verticale apri_orizzontale diagonale_sx diagonale_dx strisce_orizzontali strisce_verticali radiale schiaccia_o schiaccia_v grigio cubo_sx cubo_dx ribalta caduta zoom_out persiana; do
            echo "{\"tipo\":\"$t\"}" > t.json
            npx remotion still src/index.ts ProvaTransizione out/tr/$t.png --props=t.json --frame=12 --log=error || echo "ERRORE $t"
          done
      - name: Animazioni di testo
        if: contains(github.event.inputs.sezioni, 'animazioni')
        working-directory: grafiche
        run: |
          mkdir -p out/an
          for a in $(grep -oE '^  [a-z_]+: \{ da:' src/montatore/animazioni.tsx | awk '{print $1}' | tr -d ':'); do
            echo "{\"da\":0,\"a\":2,\"testo\":\"Panettone fatto a mano\",\"stile\":\"anima\",\"animazione\":\"$a\",\"unita\":\"parole\",\"accento\":\"#FFD60A\",\"chiave\":[\"mano\"]}" > a.json
            npx remotion still src/index.ts ProvaTitolo out/an/$a.png --props=a.json --frame=9 --log=error || echo "ERRORE $a"
          done
      - name: Elementi
        if: contains(github.event.inputs.sezioni, 'elementi')
        working-directory: grafiche
        run: |
          mkdir -p out/el
          for e in freccia freccia_curva cerchio riquadro sottolinea scarabocchio spunta croce scintille lente conto_rovescia etichetta punto stelle; do
            echo "{\"tipo\":\"$e\",\"da\":0,\"a\":2,\"x\":0.55,\"y\":0.45,\"testo\":\"NOVITÀ\",\"numero\":3}" > e.json
            npx remotion still src/index.ts ProvaElemento out/el/$e.png --props=e.json --frame=20 --log=error || echo "ERRORE $e"
          done
      - name: Parole dietro
        if: contains(github.event.inputs.sezioni, 'dietro')
        working-directory: grafiche
        run: |
          mkdir -p public out/dt
          D="drawbox=x=380:y=60:w=320:h=420:color=0xD9A27A@1:t=fill,drawbox=x=180:y=470:w=720:h=1450:color=0x9FC9D6@1:t=fill"
          ffmpeg -v error -f lavfi -i "color=c=0x6E78C8:s=1080x1920:r=30:d=3" -vf "$D" -pix_fmt yuv420p -y public/base.mp4
          ffmpeg -v error -f lavfi -i "color=c=black@0.0:s=1080x1920:r=30:d=3,format=rgba,$D" -c:v libvpx-vp9 -pix_fmt yuva420p -auto-alt-ref 0 -y public/ritaglio.webm
          cat > d.json <<'J'
          {"durata":3,"fps":30,"video":"base.mp4","ritaglio":"ritaglio.webm","volto":{"cx":0.5,"cy":0.2},
           "palette":{"fondo":"#F1EFEA","inchiostro":"#17171A","accento":"#0E9F9A","secondario":"#CFE9E7","tenue":"rgba(0,0,0,.08)"},
           "parole":[{"t":"La","da":0.1,"a":0.3},{"t":"casa","da":0.3,"a":0.6},{"t":"decide","da":0.6,"a":0.9,"k":true},{"t":"da","da":0.9,"a":1.0},{"t":"sola","da":1.0,"a":1.4}],
           "righe":[{"da":0.1,"a":2.8,"p":[0,1,2,3,4]}],
           "scene":[{"da":1.0,"a":2.9,"tipo":"card","dati":{"etichetta":"Vantaggi","titolo":"Comfort, tempo, controllo","testo":"Luci, tapparelle e termostato"}}],"adesivi":[{"da":1.2,"tipo":"ai"}]}
          J
          for fr in 20 60; do npx remotion still src/index.ts Dietro out/dt/dietro_$fr.png --props=d.json --frame=$fr --log=error || echo "ERRORE dietro"; done
      - name: Tavola
        run: |
          pip install -q pillow && python3 grafiche/tavola.py && cd grafiche/out
          mkdir -p /tmp/pub && cp *.jpg /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b anteprime-stili && git add . && git -c user.name=motore -c user.email=motore@momento commit -qm anteprime
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" anteprime-stili
