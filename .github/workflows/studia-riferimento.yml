# Scarica un reel di riferimento (qualsiasi link supportato da yt-dlp) e pubblica le tavole dei fotogrammi
# sul ramo "studio-riferimento", per studiarne stile, testi, effetti e ritmo.
name: studia-riferimento
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link del reel"
        required: false
  push:
    paths: ['riferimento.txt']
permissions:
  contents: write
jobs:
  studia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q yt-dlp pillow
      - name: Scarica e studia (uno o più link, uno per riga)
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          if [ -n "$URL" ]; then echo "$URL" > lista.txt; else grep -E '^https?://' "$GITHUB_WORKSPACE/riferimento.txt" > lista.txt; fi
          n=0
          while read -r U; do
            n=$((n+1)); d=$(printf "r%02d" $n); mkdir -p $d; echo "$U" > $d/link.txt
            ( cd $d
              yt-dlp -q --sleep-requests 2 --extractor-args "youtube:player_client=web_safari,ios,tv" -f "bv*[height<=1280]+ba/b" --merge-output-format mp4 -o rif.mp4 "$U" || yt-dlp -q -o rif.mp4 "$U" || { echo "download non riuscito" > errore.txt; exit 0; }
              ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of compact rif.mp4 > info.txt
              ffmpeg -loglevel error -i rif.mp4 -vf "fps=4,scale=270:-2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{pts\:hms}':x=6:y=6:fontsize=18:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=6x4" tavola_%02d.jpg
              ffmpeg -loglevel error -i rif.mp4 -vf "fps=1,scale=480:-2" grande_%02d.jpg
              rm -f rif.mp4 )
          done < lista.txt
          ls -R | head -50
          # il materiale di terzi non va in chiaro su un ramo pubblico: lo cifro con la chiave pubblica dello studio
          tar czf /tmp/studio.tgz r*/
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/studio.tgz -out /tmp/studio.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/motore/chiave_studio.pem" -in /tmp/k.bin -out /tmp/k.enc
          mkdir -p /tmp/pub && cp /tmp/studio.enc /tmp/k.enc /tmp/pub/ && echo ok > /tmp/pub/fatto.txt
          cd /tmp/pub && git init -q && git checkout -q -b studio-riferimento && git add . \
            && git -c user.name=motore -c user.email=motore@momento commit -qm studio \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" studio-riferimento
