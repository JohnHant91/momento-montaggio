# Confronto col montaggio umano: da quale clip e secondo viene ogni pezzo del reel di Johnny e di quello AI. Risultato cifrato.
name: confronta

on:
  workflow_dispatch:
    inputs:
      reel_ai: { required: false, default: '' }
      ruote: { required: false, default: '{"*sony*": -90, "C0050.MP4": 0, "C0061.MP4": 0, "C0062.MP4": 0, "C0060.MP4": 90}' }

permissions:
  id-token: write
  contents: write

env:
  REGIA: https://momento-reel.gestionalelcl.workers.dev

jobs:
  confronta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: motore/requisiti_vista.txt }
      - name: Modello CLIP (in cache)
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: clip-b32-v1 }
      - name: Strumenti
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null)
          pip install -q -r motore/requisiti_vista.txt
      - name: Confronto
        run: python3 motore/confronta.py
        env: { RUOTE: "${{ github.event.inputs.ruote }}", REEL_AI: "${{ github.event.inputs.reel_ai }}" }
      - name: Risultato (cifrato)
        if: always()
        run: |
          ls /tmp/tavole/confronto.json >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/out && cd /tmp/tavole && tar czf /tmp/t.tgz confronto.json
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/t.tgz -out /tmp/out/tavole.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/motore/chiave_studio.pem" -in /tmp/k.bin -out /tmp/out/k.enc
          cd /tmp/out && git init -q && git checkout -q -b confronto && git add . \
          && git -c user.name=motore -c user.email=motore@momento commit -qm "confronto" \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" confronto
