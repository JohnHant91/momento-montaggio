# Esplora le CLUT di G'MIC (oltre 1000 look di pellicole e grading) e prova l'esportazione in .cube per il motore.
name: prova-lut
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/prova-lut.yml', 'motore/lut.py']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa G'MIC
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -q gmic || true
          python3 -c "import gmic; print('gmic python ok')" || (sudo -E apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends gmic)
      - name: Elenco e prova
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          python3 - > prova_export.txt 2>&1 <<'PY' || true
          import gmic, traceback
          g = gmic.Gmic()
          for cmd in ['help clut', 'help output_cube']:
              try: g.run(cmd)
              except Exception as e: print('ERR', cmd, e)
          try:
              g.run('clut kodak_2383_constlmap,33 output_cube k2383.cube'); print('export ok')
          except Exception: traceback.print_exc()
          PY
          (gmic -h clut > aiuto_clut.txt 2>&1) || true
          ls -la >> prova_export.txt; head -12 k2383.cube >> prova_export.txt 2>/dev/null || true
          git init -q && git checkout -q -b prove-lut && git add . 
          git -c user.name=motore -c user.email=motore@momento commit -qm prova
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prove-lut
