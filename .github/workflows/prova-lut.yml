# Esplora le LUT gratuite di G'MIC (pellicole e grading): scarica i pacchetti .cube, elenca i nomi e fa una tavola di prova.
name: prova-lut
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/prova-lut.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica i pacchetti
        run: |
          mkdir -p /tmp/lut /tmp/pub && cd /tmp/lut
          for p in print negative_color negative_new negative_old slide_color instant_consumer instant_pro bw black_white others pixlsus picturefx berat editingcorp kylerholland ohadperetz jtsemple inavision lutify cinematic fuji kodak films colorful moviz; do
            if curl -sfL --max-time 120 -o $p.zip "https://gmic.eu/color_presets/$p/${p}_cube.zip"; then
              mkdir -p $p && (unzip -qo $p.zip -d $p || true); echo "$p: $(find $p -name '*.cube' | wc -l) lut" >> /tmp/pub/pacchetti.txt
            else echo "$p: non trovato" >> /tmp/pub/pacchetti.txt; fi
          done
          find . -name '*.cube' | sed 's|^\./||' | sort > /tmp/pub/elenco.txt
          wc -l /tmp/pub/elenco.txt; cat /tmp/pub/pacchetti.txt
          head -15 "$(find . -name '*.cube' | head -1)" > /tmp/pub/esempio_cube.txt || true
          du -sh /tmp/lut >> /tmp/pub/pacchetti.txt
      - name: Pubblica elenco
        run: |
          cd /tmp/pub && git init -q && git checkout -q -b prove-lut && git add .
          git -c user.name=motore -c user.email=motore@momento commit -qm prova
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prove-lut
