# Tavola di prova della libreria LUT (motore/lut_catalogo.json) su due foto CC di Wikimedia.
name: prova-lut
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/prova-lut.yml', 'motore/lut_catalogo.json', 'motore/lut.py']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tavola
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          pip install -q pillow numpy
          mkdir -p /tmp/pub
          curl -sfL -o /tmp/a.jpg "https://upload.wikimedia.org/wikipedia/commons/9/9d/San_Marco_di_Castellabate.jpg"
          curl -sfL -o /tmp/b.jpg "https://upload.wikimedia.org/wikipedia/commons/b/b2/Castellabate%2C_July_2021_01.jpg"
          cd motore && python3 lut.py /tmp/a.jpg /tmp/b.jpg /tmp/pub
      - name: Pubblica
        run: |
          cd /tmp/pub && echo "Foto: San Marco di Castellabate (VincenzoCatapano, CC BY-SA 4.0), Castellabate (Jo-Jo Eumerus, CC BY-SA 4.0), Wikimedia Commons. LUT: collezioni G'MIC (gmic.eu)." > CREDITI.txt
          git init -q && git checkout -q -b prove-lut && git add .
          git -c user.name=motore -c user.email=motore@momento commit -qm prova
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prove-lut
